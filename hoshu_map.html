<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="補修図面">
<meta name="theme-color" content="#1a1a2e">
<link rel="manifest" href="manifest.json">
<title>補修図面アプリ</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
button{touch-action:manipulation;font-family:inherit;}
body{font-family:'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;background:#0f0f1a;height:100dvh;display:flex;flex-direction:column;overflow:hidden;color:white;}
/* 現場選択 */
#projectScreen{position:fixed;inset:0;background:#0f0f1a;z-index:2000;display:flex;flex-direction:column;}
.ps-header{background:#1a1a2e;padding:14px 18px;border-bottom:1px solid #2a2a4a;}
.ps-header h2{font-size:17px;font-weight:800;}
.ps-header h2 span{color:#f5a623;}
.ps-list{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;}
.ps-empty{color:#555;text-align:center;padding:48px 20px;font-size:14px;line-height:2;}
.ps-card{background:#1a1a2e;border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;border:2px solid transparent;transition:border-color .15s;}
.ps-card:active{border-color:#f5a623;}
.ps-icon{font-size:26px;flex-shrink:0;}
.ps-info{flex:1;min-width:0;}
.ps-name{font-size:15px;font-weight:700;}
.ps-meta{color:#888;font-size:11px;margin-top:3px;}
.ps-btn{padding:6px 10px;border:none;border-radius:8px;font-size:12px;cursor:pointer;flex-shrink:0;}
.ps-edit{background:#2a2a4a;color:#f5a623;}
.ps-del{background:#2a1a1a;color:#f88;}
.ps-new{margin:0 14px 16px;padding:14px;background:#f5a623;color:#1a1a1a;border:none;border-radius:14px;font-size:15px;font-weight:700;cursor:pointer;}
/* ヘッダー */
header{background:#1a1a2e;padding:6px 12px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;border-bottom:1px solid #2a2a4a;min-height:44px;}
.hd-title{font-size:13px;font-weight:800;}
.hd-title span{color:#f5a623;}
.proj-badge{background:#2a2a4a;color:#f5a623;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;cursor:pointer;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-left:8px;}
.menu-btn{background:#2a2a4a;color:white;border:none;border-radius:8px;font-size:18px;padding:5px 12px;cursor:pointer;}
/* メニュー */
#dropMenu{display:none;position:fixed;top:46px;right:10px;background:#1c1c2e;border-radius:14px;box-shadow:0 8px 32px rgba(0,0,0,.5);z-index:500;min-width:210px;overflow:hidden;}
.dm-btn{width:100%;padding:13px 18px;border:none;background:transparent;color:white;font-size:14px;text-align:left;cursor:pointer;border-bottom:1px solid #2a2a4a;}
.dm-btn:last-child{border-bottom:none;}
.dm-btn:active{background:#2a2a4a;}
.dm-sep{height:1px;background:#2a2a4a;}
#menuOverlay{display:none;position:fixed;inset:0;z-index:499;}
/* タブバー */
.sheet-bar{background:#16213e;display:flex;align-items:center;height:34px;flex-shrink:0;overflow-x:auto;overflow-y:hidden;gap:2px;padding:0 4px;border-bottom:1px solid #2a2a4a;}
.sheet-bar::-webkit-scrollbar{height:3px;}
.sheet-bar::-webkit-scrollbar-thumb{background:#444;border-radius:2px;}
.s-tab{display:flex;align-items:center;gap:4px;padding:3px 9px;border:none;border-radius:5px;background:transparent;color:#777;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0;}
.s-tab.active{background:#2a2a4a;color:white;}
.s-tab .sx{font-size:12px;color:#666;margin-left:2px;}
.s-tab.active .sx{color:#aaa;}
.s-add{padding:3px 10px;border:none;border-radius:5px;background:transparent;color:#f5a623;font-size:18px;cursor:pointer;flex-shrink:0;}
/* インジケーター */
.indicator{display:flex;align-items:center;gap:5px;padding:4px 10px;background:#16213e;font-size:11px;color:#ccc;flex-shrink:0;border-bottom:1px solid #2a2a4a;min-height:30px;overflow-x:auto;}
.indicator::-webkit-scrollbar{display:none;}
.ind-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.mode-btn,.quick-btn{padding:3px 8px;border-radius:16px;border:none;font-size:10px;font-weight:700;cursor:pointer;flex-shrink:0;}
.quick-btn{background:#2a2a4a;color:#888;}
.sz-btn{padding:2px 6px;border:1.5px solid #444;border-radius:5px;background:#2a2a4a;color:#888;font-size:10px;font-weight:700;cursor:pointer;min-width:20px;text-align:center;}
.sz-btn.active{border-color:#f5a623;color:#f5a623;background:#3a3a5a;}
.zc-btn{padding:2px 7px;border:none;border-radius:5px;background:#2a2a4a;color:#ccc;font-size:12px;cursor:pointer;}
.zc-slider{width:55px;height:4px;accent-color:#f5a623;cursor:pointer;}
.zc-label{font-size:10px;color:#888;min-width:32px;}
.reset-btn{padding:2px 7px;border-radius:14px;border:none;font-size:10px;cursor:pointer;background:#3a3a5a;color:#ccc;}
/* メイン */
.main{display:flex;flex:1;overflow:hidden;min-height:0;}
.sidebar{width:60px;background:#16213e;display:flex;flex-direction:column;flex-shrink:0;border-right:1px solid #2a2a4a;overflow-y:auto;}
.sb-btn{width:100%;padding:10px 4px;border:none;background:transparent;color:#777;font-size:9px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;border-bottom:1px solid #2a2a4a;position:relative;}
.sb-btn .sb-icon{font-size:18px;}
.sb-btn.active{background:#2a2a4a;color:#f5a623;}
.sb-btn.active::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:#f5a623;border-radius:0 3px 3px 0;}
.badge-dot{position:absolute;top:7px;right:12px;background:#e94560;color:white;font-size:8px;font-weight:700;min-width:15px;height:15px;border-radius:8px;display:none;align-items:center;justify-content:center;padding:0 3px;}
.badge-dot.show{display:flex;}
/* キャンバス */
.canvas-area{flex:1;position:relative;overflow:hidden;background:#1a1a2e;display:flex;align-items:center;justify-content:center;min-height:0;}
.upload-hint{position:absolute;display:flex;flex-direction:column;align-items:center;gap:14px;color:#555;z-index:3;pointer-events:none;text-align:center;}
.upload-hint .uh-icon{font-size:52px;}
.canvas-container{position:relative;box-shadow:0 8px 40px rgba(0,0,0,.5);flex-shrink:0;}
#bgCanvas,#markerCanvas{position:absolute;top:0;left:0;display:block;}
#bgCanvas{z-index:1;}
#markerCanvas{z-index:2;cursor:crosshair;}
/* ドロワー */
.drawer{position:fixed;top:0;bottom:0;left:60px;width:200px;background:#16213e;z-index:150;transform:translateX(-265px);transition:transform .28s cubic-bezier(.34,1.56,.64,1);overflow-y:auto;box-shadow:4px 0 24px rgba(0,0,0,.4);border-right:1px solid #2a2a4a;}
.drawer.open{transform:translateX(0);}
.drawer-overlay{position:fixed;top:0;bottom:0;left:60px;right:0;background:rgba(0,0,0,.3);z-index:140;display:none;}
.drawer-overlay.show{display:block;}
.dw-content{padding:14px 12px 24px;}
.dw-title{font-size:10px;font-weight:700;color:#888;letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid #2a2a4a;}
.def-btn{width:100%;padding:10px;border:2px solid transparent;border-radius:10px;background:#2a2a4a;color:white;font-size:11px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:7px;margin-bottom:6px;}
.def-btn.active{border-color:currentColor;background:#3a3a5a;}
.def-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;}
.count-card{background:#111128;border-radius:9px;padding:9px 11px;margin-bottom:6px;}
.count-card-header{display:flex;align-items:center;gap:6px;margin-bottom:3px;}
.count-dot{width:9px;height:9px;border-radius:50%;}
.count-label{font-size:11px;color:#bbb;flex:1;}
.count-val{font-size:14px;font-weight:700;padding-left:15px;}
.action-row{display:flex;gap:8px;margin-top:12px;}
.act-btn{flex:1;padding:10px;border:none;border-radius:10px;font-size:12px;font-weight:600;cursor:pointer;}
.btn-undo{background:#3a3a5a;color:#ddd;}
.btn-clear{background:#4a1a2a;color:#f88;}
/* ポップアップ */
.popup{position:fixed;background:white;border-radius:18px;padding:18px;box-shadow:0 8px 40px rgba(0,0,0,.4);z-index:300;width:min(380px,90vw);left:50%;top:50%;transform:translate(-50%,-50%);display:none;color:#1a1a2e;}
.popup h4{font-size:15px;font-weight:700;margin-bottom:12px;}
.pf-label{font-size:10px;font-weight:700;color:#888;margin-bottom:4px;}
.pf-row{display:flex;gap:8px;align-items:center;margin-bottom:10px;}
.pf-row input,.pf-row select,.pf-row textarea{width:100%;padding:9px 11px;border:1.5px solid #ddd;border-radius:9px;font-size:15px;font-family:inherit;background:#fafafa;}
.pf-row textarea{height:50px;resize:none;font-size:13px;}
.unit-lbl{font-size:12px;color:#888;white-space:nowrap;}
.popup-btns{display:flex;gap:8px;margin-top:12px;}
.pb-cancel{flex:1;padding:11px;background:#eee;color:#666;border:none;border-radius:10px;font-size:13px;cursor:pointer;}
.pb-del{flex:1;padding:11px;background:#fde;color:#c00;border:none;border-radius:10px;font-size:13px;cursor:pointer;display:none;}
.pb-save{flex:1;padding:11px;background:#1a1a2e;color:white;border:none;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;}
/* レポートモーダル */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:400;display:none;align-items:center;justify-content:center;}
.modal-overlay.show{display:flex;}
.modal{background:white;border-radius:18px;padding:20px;width:92%;max-width:640px;max-height:88vh;overflow-y:auto;color:#1a1a2e;}
.modal h2{font-size:15px;font-weight:700;margin-bottom:12px;padding-bottom:10px;border-bottom:2px solid #1a1a2e;}
.rep-tabs{display:flex;gap:6px;margin-bottom:12px;}
.rep-tab{flex:1;padding:8px;border:none;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;}
.rep-tab.active{background:#1a1a2e;color:white;}
.rep-tab:not(.active){background:#eee;color:#555;}
.rep-table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:14px;}
.rep-table th{background:#1a1a2e;color:white;padding:8px 10px;text-align:left;font-size:11px;}
.rep-table td{padding:8px 10px;border-bottom:1px solid #eee;}
.rep-table tr:nth-child(even) td{background:#f8f8f8;}
.modal-btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
.mb-btn{padding:9px 13px;border:none;border-radius:10px;font-size:12px;font-weight:600;cursor:pointer;}
.badge{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;}
</style>
</head>
<body>
<!-- 現場選択 -->
<div id="projectScreen">
  <div class="ps-header"><h2>補修図面 <span>現場一覧</span></h2></div>
  <div class="ps-list" id="psList"></div>
  <button class="ps-new" onclick="openNewProjModal()">＋ 新しい現場を追加</button>
</div>

<!-- 現場名入力モーダル -->
<div id="newProjModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:3000;align-items:center;justify-content:center;">
  <div style="background:#1a1a2e;border-radius:16px;padding:22px;width:min(360px,88vw);">
    <p style="font-size:14px;font-weight:700;margin-bottom:12px;">現場名を入力</p>
    <input id="newProjName" type="text" placeholder="例）〇〇マンション外壁補修" onkeydown="if(event.key==='Enter')confirmNewProj()"
      style="width:100%;padding:11px 13px;border-radius:10px;border:none;font-size:15px;font-family:inherit;background:#2a2a4a;color:white;margin-bottom:14px;">
    <div style="display:flex;gap:10px;">
      <button onclick="document.getElementById('newProjModal').style.display='none'" style="flex:1;padding:11px;border:none;border-radius:10px;background:#2a2a4a;color:#ccc;font-size:14px;cursor:pointer;">キャンセル</button>
      <button onclick="confirmNewProj()" style="flex:1;padding:11px;border:none;border-radius:10px;background:#f5a623;color:#1a1a1a;font-size:14px;font-weight:700;cursor:pointer;">作成</button>
    </div>
  </div>
</div>

<!-- ヘッダー -->
<header>
  <div style="display:flex;align-items:center;">
    <span class="hd-title">補修図面 <span>M</span></span>
    <span class="proj-badge" id="projBadge" onclick="openProjectScreen()">現場</span>
  </div>
  <button class="menu-btn" onclick="toggleMenu()">☰</button>
</header>

<!-- ドロップダウン -->
<div id="dropMenu">
  <button class="dm-btn" onclick="document.getElementById('fileInput').click();closeMenu()">📂 図面を追加</button>
  <button class="dm-btn" onclick="savePNG();closeMenu()">⬇️ PNG保存</button>
  <button class="dm-btn" onclick="sharePNG();closeMenu()">📤 図面を共有</button>
  <button class="dm-btn" onclick="printDrawing();closeMenu()">🖨 図面印刷</button>
  <button class="dm-btn" onclick="showReport();closeMenu()">📋 レポート</button>
  <div class="dm-sep"></div>
  <button class="dm-btn" style="color:#f5a623;" onclick="backupProject();closeMenu()">💾 データ保存</button>
  <button class="dm-btn" style="color:#f5a623;" onclick="document.getElementById('restoreInput').click();closeMenu()">📥 データ読み込み</button>
  <button class="dm-btn" style="color:#27ae60;" onclick="saveReportExcel();closeMenu()">📊 Excelレポート出力</button>
  <button class="dm-btn" style="color:#2980b9;" onclick="saveReportDocx();closeMenu()">📝 Word出力</button>
  <button class="dm-btn" style="color:#e67e22;" onclick="shareAll();closeMenu()">📤 全データを共有</button>
</div>
<div id="menuOverlay" onclick="closeMenu()"></div>
<input type="file" id="fileInput" accept="image/*,application/pdf,.pdf" onchange="loadFile(event)" style="display:none">
<input type="file" id="restoreInput" accept=".json,application/json,text/plain" onchange="restoreProject(event)" style="display:none">

<!-- タブバー -->
<div class="sheet-bar" id="sheetBar">
  <button class="s-add" onclick="document.getElementById('fileInput').click()">＋</button>
</div>

<!-- インジケーター（2段レイアウト） -->
<div style="background:#16213e;border-bottom:1px solid #2a2a4a;flex-shrink:0;">
  <!-- 1段目：種別・モード・連続 -->
  <div style="display:flex;align-items:center;gap:5px;padding:4px 10px;min-height:32px;">
    <div class="ind-dot" id="indDot" style="background:#27ae60;width:8px;height:8px;border-radius:50%;flex-shrink:0;"></div>
    <span id="indType" style="font-size:11px;color:#ccc;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">クラック</span>
    <button class="mode-btn" id="modeBtn" onclick="toggleMode()" style="background:#27ae60;color:white;padding:4px 10px;border-radius:16px;border:none;font-size:11px;font-weight:700;cursor:pointer;flex-shrink:0;">✏️ マーキング</button>
    <button id="quickBtn" onclick="toggleQuickMode()" style="background:#2a2a4a;color:#888;padding:4px 10px;border-radius:16px;border:none;font-size:11px;font-weight:700;cursor:pointer;flex-shrink:0;">⚡ 連続</button>
  </div>
  <!-- 2段目：サイズ・ズーム -->
  <div style="display:flex;align-items:center;gap:4px;padding:3px 10px 4px;border-top:1px solid #1a1a2e;">
    <span style="font-size:9px;color:#666;flex-shrink:0;">サイズ</span>
    <button class="sz-btn" data-sz="1" onclick="selectSize(this)">1</button>
    <button class="sz-btn" data-sz="2" onclick="selectSize(this)">2</button>
    <button class="sz-btn active" data-sz="3" onclick="selectSize(this)">3</button>
    <div style="display:flex;align-items:center;gap:3px;margin-left:auto;flex-shrink:0;">
      <button class="zc-btn" onclick="changeZoom(-.15)">−</button>
      <input class="zc-slider" type="range" id="zoomSlider" min=".1" max="5" step=".05" value="1" oninput="viewScale=+this.value;applyTransform()" style="width:50px;height:4px;accent-color:#f5a623;">
      <button class="zc-btn" onclick="changeZoom(.15)">＋</button>
      <span id="zoomLbl" style="font-size:10px;color:#888;min-width:32px;">100%</span>
      <button onclick="resetView()" style="padding:2px 7px;border-radius:14px;border:none;font-size:10px;cursor:pointer;background:#3a3a5a;color:#ccc;">🔄</button>
    </div>
  </div>
</div>

<div class="main">
  <div class="sidebar">
    <button class="sb-btn active" id="sb-defect" onclick="toggleDrawer('dwDefect','sb-defect')">
      <span class="sb-icon">🔍</span>種別
    </button>
    <button class="sb-btn" id="sb-count" onclick="toggleDrawer('dwCount','sb-count')">
      <span class="sb-icon">📊</span>集計
      <span class="badge-dot" id="totalBadge">0</span>
    </button>
  </div>
  <div class="canvas-area" id="canvasArea">
    <div class="upload-hint" id="uploadHint">
      <div class="uh-icon">🏗️</div>
      <p style="font-size:14px;line-height:1.8;">「図面を追加」から<br>画像を読み込んでください</p>
    </div>
    <div class="canvas-container" id="canvasContainer" style="width:400px;height:300px;">
      <canvas id="bgCanvas" width="400" height="300"></canvas>
      <canvas id="markerCanvas" width="400" height="300"></canvas>
    </div>
  </div>
</div>

<div class="drawer-overlay" id="drawerOverlay" onclick="closeAllDrawers()"></div>
<div class="drawer" id="dwDefect"><div class="dw-content"><div class="dw-title">不具合種別</div><div id="defectGrid"></div></div></div>
<div class="drawer" id="dwCount"><div class="dw-content"><div class="dw-title">集計</div><div id="countList"></div><div class="action-row"><button class="act-btn btn-undo" onclick="undoLast()">↩ 戻す</button><button class="act-btn btn-clear" onclick="clearAll()">🗑 全削除</button></div></div></div>

<!-- 入力ポップアップ -->
<div class="popup" id="popup">
  <h4 id="popTitle">📝 補修箇所</h4>
  <div id="typeSelectWrap" style="display:none;margin-bottom:10px;">
    <div class="pf-label">種別変更</div>
    <div class="pf-row"><select id="editTypeSelect"></select></div>
  </div>
  <div class="pf-label" id="valLabel">数量</div>
  <div class="pf-row">
    <input type="number" id="valInput" min="0" step="0.01" placeholder="0">
    <span class="unit-lbl" id="unitLbl">—</span>
  </div>
  <div class="pf-label">メモ（任意）</div>
  <div class="pf-row"><textarea id="memoInput" placeholder="備考など"></textarea></div>
  <div class="popup-btns">
    <button class="pb-del" id="delBtn" onclick="deleteMark()">🗑 削除</button>
    <button class="pb-cancel" onclick="cancelMark()">キャンセル</button>
    <button class="pb-save" onclick="saveMark()">保存</button>
  </div>
</div>

<!-- レポートモーダル -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2 id="repTitle">📋 レポート</h2>
    <div class="rep-tabs">
      <button class="rep-tab active" id="repTabCur" onclick="showReport('current')">📄 現在の図面</button>
      <button class="rep-tab" id="repTabAll" onclick="showReport('all')">📊 全図面合計</button>
    </div>
    <table class="rep-table">
      <thead><tr><th>種別</th><th style="text-align:right">数量</th><th style="text-align:right">メモ</th></tr></thead>
      <tbody id="repBody"></tbody>
    </table>
    <div class="modal-btns">
      <button class="mb-btn" style="background:#eee;color:#555;" onclick="closeReport()">閉じる</button>
      <button class="mb-btn" style="background:#27ae60;color:white;" onclick="savePNG()">⬇️ 図面PNG</button>
      <button class="mb-btn" style="background:#2ecc71;color:white;" onclick="sharePNG()">📤 図面共有</button>
      <button class="mb-btn" style="background:#1a1a2e;color:white;" onclick="printDrawing()">🖨 図面印刷</button>
      <button class="mb-btn" style="background:#8e44ad;color:white;" onclick="saveReportPNG()">⬇️ レポートPNG</button>
      <button class="mb-btn" style="background:#9b59b6;color:white;" onclick="shareReportPNG()">📤 レポート共有</button>
      <button class="mb-btn" style="background:#e67e22;color:white;" onclick="printReport()">🖨 レポート印刷</button>
      <button class="mb-btn" style="background:#27ae60;color:white;" onclick="saveReportExcel()">📊 Excel</button>
      <button class="mb-btn" style="background:#2980b9;color:white;" onclick="saveReportDocx()">📝 Word</button>
    </div>
  </div>
</div>

<script>
'use strict';
// ===== 定数 =====
const DEFECTS={
  crack:  {label:'クラック',    color:'#27ae60',shape:'wave',    unit:'m',  unitLabel:'m', sym:'〜'},
  crack03:{label:'クラック0.3↑',color:'#4fc3f7',shape:'wave',    unit:'m',  unitLabel:'m', sym:'U〜'},

// ===== IndexedDB =====
let idb=null;
function openIDB(){
  return new Promise((res,rej)=>{
    if(idb){res(idb);return;}
    const req=indexedDB.open('hoshu_map_v2',1);
    req.onupgradeneeded=e=>{if(!e.target.result.objectStoreNames.contains('images'))e.target.result.createObjectStore('images');};
    req.onsuccess=e=>{idb=e.target.result;res(idb);};
    req.onerror=e=>rej(e);
  });
}
async function saveImg(pid,idx,data){
  try{const db=await openIDB();const tx=db.transaction('images','readwrite');tx.objectStore('images').put(data,`${pid}_${idx}`);return new Promise(r=>{tx.oncomplete=()=>r(true);tx.onerror=()=>r(false);});}catch{return false;}
}
async function loadImg(pid,idx){
  try{const db=await openIDB();return new Promise(r=>{const req=db.transaction('images','readonly').objectStore('images').get(`${pid}_${idx}`);req.onsuccess=()=>r(req.result||null);req.onerror=()=>r(null);});}catch{return null;}
}
async function deleteImgs(pid){
  try{const db=await openIDB();const tx=db.transaction('images','readwrite');const store=tx.objectStore('images');const keys=await new Promise(r=>{const req=store.getAllKeys();req.onsuccess=()=>r(req.result||[]);req.onerror=()=>r([]);});keys.filter(k=>k.startsWith(pid+'_')).forEach(k=>store.delete(k));}catch{}
}

const SP=(id,v)=>{ try{localStorage.setItem(id,JSON.stringify(v));return true;}catch{return false;}};
function loadProjs(){return LP('hp_projects')||[];}

async function switchSheet(idx){
  if(currentSheetIdx>=0&&sheets[currentSheetIdx]){
    sheets[currentSheetIdx].markers=[...markers];
    if(imageLoaded&&currentProjectId)try{await saveImg(currentProjectId,currentSheetIdx,bgCanvas.toDataURL('image/png'));}catch{}
  }
  if(currentProjectId)try{localStorage.setItem('hp_'+currentProjectId,JSON.stringify({sheets:sheets.map(s=>({name:s.name,markers:s.markers})),currentSheetIdx:idx}));}catch{}
  currentSheetIdx=idx;
  markers=[...(sheets[idx].markers||[])];
  const imgData=currentProjectId?await loadImg(currentProjectId,idx):null;
  if(imgData){
    const img=new Image();
    img.onload=()=>{
      setCanvasSize(img.width,img.height);
      bgCtx.drawImage(img,0,0,bgCanvas.width,bgCanvas.height);
      imageLoaded=true;
      document.getElementById('uploadHint').style.display='none';
      // 古いピクセル座標を元画像サイズで正確に比率変換
      markers=markers.map(m=>{
        if(m._needsConvert||m.x>1||m.y>1){
          return {...m,x:m.x/img.naturalWidth,y:m.y/img.naturalHeight,_needsConvert:false};
        }
        return m;
      });
      redraw();updateCounts();
    };
    img.src=imgData;
  } else {
    imageLoaded=false;bgCtx.clearRect(0,0,bgCanvas.width,bgCanvas.height);mCtx.clearRect(0,0,markerCanvas.width,markerCanvas.height);

// ===== ファイル読み込み =====
function loadFile(e){
  const file=e.target.files[0];if(!file)return;e.target.value='';
  if(!currentProjectId){toast('先に現場を選択してください','#e94560');openProjectScreen();return;}
  if(file.type==='application/pdf'||file.name.toLowerCase().endsWith('.pdf')){
    loadPDF(file);
  } else {
    loadImage(file);
  }
}

async function loadPDF(file){
  toast('📄 PDF読み込み中...','#2980b9');
  // PDF.jsをCDNから動的ロード
  if(!window.pdfjsLib){
    await new Promise((res,rej)=>{
      const s=document.createElement('script');
      s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
      s.onload=()=>{
        pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        res();
      };
      s.onerror=rej;
      document.head.appendChild(s);
    });
  }
  const arrayBuf=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:arrayBuf}).promise;
  const totalPages=pdf.numPages;
  const baseName=file.name.replace(/\.pdf$/i,'').slice(0,14);
  toast(`📄 ${totalPages}ページ読み込み中...`,'#2980b9');

  for(let pageNum=1;pageNum<=totalPages;pageNum++){
    const page=await pdf.getPage(pageNum);
    const viewport=page.getViewport({scale:2.0}); // 高解像度
    const canvas=document.createElement('canvas');
    canvas.width=viewport.width;canvas.height=viewport.height;
    const ctx=canvas.getContext('2d');
    await page.render({canvasContext:ctx,viewport}).promise;

    // キャンバスから画像データを取得
    const imgData=canvas.toDataURL('image/png');
    const name=totalPages>1?`${baseName}_P${pageNum}`:baseName;

    // 現在のシートを保存してから新しいシートを追加
    if(currentSheetIdx>=0&&sheets[currentSheetIdx]){
      sheets[currentSheetIdx].markers=[...markers];
      if(imageLoaded&&currentProjectId)try{await saveImg(currentProjectId,currentSheetIdx,bgCanvas.toDataURL('image/png'));}catch{}
    }

    const img=new Image();
    await new Promise(res=>{
      img.onload=async()=>{
        setCanvasSize(img.width,img.height);
        bgCtx.drawImage(img,0,0,bgCanvas.width,bgCanvas.height);
        imageLoaded=true;
        document.getElementById('uploadHint').style.display='none';
        const ni=sheets.length;
        sheets.push({name,markers:[]});currentSheetIdx=ni;markers=[];
        await saveImg(currentProjectId,ni,imgData);
        res();
      };
      img.src=imgData;
    });
  }

  renderTabs();resetView();redraw();updateCounts();await saveCurrent();
  toast(`✅ PDF ${totalPages}ページを追加しました`);
}

async function loadImage(file){
  const reader=new FileReader();
  reader.onload=async ev=>{
    if(currentSheetIdx>=0&&sheets[currentSheetIdx]){
      sheets[currentSheetIdx].markers=[...markers];
      if(imageLoaded&&currentProjectId)try{await saveImg(currentProjectId,currentSheetIdx,bgCanvas.toDataURL('image/png'));}catch{}
    }
    const img=new Image();
    img.onload=async()=>{
      setCanvasSize(img.width,img.height);bgCtx.drawImage(img,0,0,bgCanvas.width,bgCanvas.height);
      imageLoaded=true;document.getElementById('uploadHint').style.display='none';
      const name=file.name.replace(/\.[^/.]+$/,'').slice(0,14);
      const ni=sheets.length;
      sheets.push({name,markers:[]});currentSheetIdx=ni;markers=[];
      await saveImg(currentProjectId,ni,bgCanvas.toDataURL('image/png'));
      renderTabs();resetView();redraw();updateCounts();await saveCurrent();
      toast(`📄 ${name} を追加`);
    };
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
}

// ===== キャンバス =====
function setCanvasSize(iw,ih){
  const area=document.getElementById('canvasArea');
  const scale=Math.min(area.clientWidth/iw,area.clientHeight/ih);
  const cw=Math.round(iw*scale),ch=Math.round(ih*scale);
  bgCanvas.width=markerCanvas.width=cw;bgCanvas.height=markerCanvas.height=ch;
  ['width','height'].forEach(p=>{bgCanvas.style[p]=cw+(p==='width'?'px':'px');});
  bgCanvas.style.width=cw+'px';bgCanvas.style.height=ch+'px';
  markerCanvas.style.width=cw+'px';markerCanvas.style.height=ch+'px';
  container.style.width=cw+'px';container.style.height=ch+'px';
  bgCanvas.style.display='block';
}
function applyTransform(){
  container.style.transform=`translate(${viewX}px,${viewY}px) scale(${viewScale})`;
  container.style.transformOrigin='center center';
  document.getElementById('zoomLbl').textContent=Math.round(viewScale*100)+'%';
  const sl=document.getElementById('zoomSlider');if(sl)sl.value=viewScale;
}
function changeZoom(d){viewScale=Math.min(Math.max(viewScale+d,.1),5);applyTransform();}
function resetView(){viewX=0;viewY=0;viewScale=1;applyTransform();}

// ===== タッチ操作 =====
let t0=null,t1=null,startDist=0,startScale=1,startX=0,startY=0,startVX=0,startVY=0;
let tapTime=0,tapMoved=false,longTimer=null,dragIdx=null,isDrag=false;

// 座標変換：クリック位置→比率（0〜1）
function getPos(cx,cy){
  const r=markerCanvas.getBoundingClientRect();
  return{
    x:(cx-r.left)*(markerCanvas.width/r.width)/markerCanvas.width,
    y:(cy-r.top)*(markerCanvas.height/r.height)/markerCanvas.height
  };
}

// 近傍マーカー検索（比率座標で統一）
function nearMarker(cx,cy){
  const r=markerCanvas.getBoundingClientRect();
  // クリック位置を比率に変換
  const rx=(cx-r.left)*(markerCanvas.width/r.width)/markerCanvas.width;
  const ry=(cy-r.top)*(markerCanvas.height/r.height)/markerCanvas.height;
  // 判定閾値も比率に変換（16px相当）
  const thX=16/markerCanvas.width;
  const thY=16/markerCanvas.height;
  for(let i=markers.length-1;i>=0;i--){
    const m=markers[i];
    if(Math.abs(rx-m.x)<thX&&Math.abs(ry-m.y)<thY)return i;
  }
  return -1;
}

markerCanvas.addEventListener('touchstart',e=>{
  e.preventDefault();tapTime=Date.now();tapMoved=false;isDrag=false;dragIdx=null;
  if(e.touches.length===1){
    t0=e.touches[0];startX=t0.clientX;startY=t0.clientY;startVX=viewX;startVY=viewY;
    const idx=nearMarker(t0.clientX,t0.clientY);
    if(idx!==-1)longTimer=setTimeout(()=>{dragIdx=idx;isDrag=true;if(navigator.vibrate)navigator.vibrate(30);},500);
  } else if(e.touches.length===2){
    clearTimeout(longTimer);t0=e.touches[0];t1=e.touches[1];
    startDist=Math.hypot(t1.clientX-t0.clientX,t1.clientY-t0.clientY);
    startScale=viewScale;startVX=viewX;startVY=viewY;
    startX=(t0.clientX+t1.clientX)/2;startY=(t0.clientY+t1.clientY)/2;
  }
},{passive:false});

markerCanvas.addEventListener('touchmove',e=>{
  e.preventDefault();tapMoved=true;clearTimeout(longTimer);
  if(isDrag&&dragIdx!==null&&e.touches.length===1){
    const p=getPos(e.touches[0].clientX,e.touches[0].clientY);
    markers[dragIdx].x=p.x;markers[dragIdx].y=p.y;redraw();
  } else if(e.touches.length===1&&mode==='move'){
    viewX=startVX+(e.touches[0].clientX-startX);viewY=startVY+(e.touches[0].clientY-startY);applyTransform();
  } else if(e.touches.length===2){
    const tt0=e.touches[0],tt1=e.touches[1];
    const dist=Math.hypot(tt1.clientX-tt0.clientX,tt1.clientY-tt0.clientY);
    viewScale=Math.min(Math.max(startScale*(dist/startDist),.2),8);
    viewX=startVX+((tt0.clientX+tt1.clientX)/2-startX);viewY=startVY+((tt0.clientY+tt1.clientY)/2-startY);
    applyTransform();
  }
},{passive:false});

markerCanvas.addEventListener('touchend',e=>{
  e.preventDefault();clearTimeout(longTimer);
  if(isDrag){isDrag=false;dragIdx=null;saveCurrent().then(()=>updateCounts());return;}
  if(!tapMoved&&Date.now()-tapTime<250&&e.changedTouches.length===1&&mode==='mark'){
    const tc=e.changedTouches[0];onCanvasClick(tc.clientX,tc.clientY);
  }
  t0=null;t1=null;
},{passive:false});

markerCanvas.addEventListener('click',e=>{if(mode==='mark')onCanvasClick(e.clientX,e.clientY);});

// ===== 描画 =====
function redraw(){
  mCtx.clearRect(0,0,markerCanvas.width,markerCanvas.height);
  markers.forEach(m=>drawM(mCtx,m,1));
}

function drawM(ctx,m,scale){
  // 比率座標をピクセルに変換
  const cw = scale===1 ? markerCanvas.width  : markerCanvas.width*scale;
  const ch = scale===1 ? markerCanvas.height : markerCanvas.height*scale;
  const x=m.x*cw, y=m.y*ch;
  const color=DEFECTS[m.type]?.color||'#888', shape=m.shape;
  const sz=(m.size||3)*scale;
  const val=m.value>0?(m.value%1===0?String(m.value):m.value.toFixed(1)):'';
  const fs=Math.max(5,sz*2);
  ctx.save();ctx.font=`bold ${fs}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
  const tw=val?ctx.measureText(val).width:0;
  if(shape==='circle'){
    const r=Math.max(sz*1.5,tw/2+sz);
    ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();
    if(val){ctx.fillStyle='white';ctx.fillText(val,x,y);}
  } else if(shape==='wave'){
    // 文字「〜」「U〜」で表示
    const symText=m.type==='crack03'?'U〜':'〜';
    const symFs=fs+sz;
    ctx.font=`bold ${symFs}px sans-serif`;
    ctx.fillStyle=color;
    ctx.fillText(symText,x,y);
    ctx.font=`bold ${fs}px sans-serif`;
    if(val){ctx.fillStyle=color;ctx.fillText(val,x,y+symFs*0.9);}
  } else if(shape==='rect'){
    const rw=Math.max(sz*3,tw+sz*2),rh=fs+sz;
    ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x-rw/2,y-rh/2,rw,rh,sz*0.5);ctx.fill();
    if(val){ctx.fillStyle='white';ctx.fillText(val,x,y);}
  } else if(shape==='triangle'){
    const tr=Math.max(sz*2,tw/2+sz*1.5),th=tr*1.8;
    ctx.beginPath();ctx.moveTo(x,y-th*.6);ctx.lineTo(x+tr,y+th*.4);ctx.lineTo(x-tr,y+th*.4);ctx.closePath();
    ctx.fillStyle=color;ctx.fill();
    if(val){ctx.fillStyle='white';ctx.fillText(val,x,y+th*.08);}
  }
  ctx.restore();
}

function updateCounts(){
  const stats={};Object.keys(DEFECTS).forEach(k=>stats[k]={total:0,count:0});
  markers.forEach(m=>{stats[m.type].count++;stats[m.type].total+=(m.value||0);});
  const total=markers.length;
  const badge=document.getElementById('totalBadge');badge.textContent=total;badge.classList.toggle('show',total>0);
  const list=document.getElementById('countList');list.innerHTML='';
  Object.entries(DEFECTS).forEach(([k,d])=>{
    const s=stats[k];if(!s.count)return;
    const ts=s.total>0?`${s.total%1===0?s.total:s.total.toFixed(2)}${d.unitLabel}`:`${s.count}件`;
    list.innerHTML+=`<div class="count-card"><div class="count-card-header"><div class="count-dot" style="background:${d.color}"></div><span class="count-label">${d.label}</span><span style="color:#666;font-size:10px">${s.count}マーカー</span></div><div class="count-val">${ts}</div></div>`;
  });

}

  const w=bgCanvas.width*scale,h=bgCanvas.height*scale;
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const ctx=c.getContext('2d');ctx.drawImage(bgCanvas,0,0,w,h);
  const tmp=document.createElement('canvas');tmp.width=w;tmp.height=h;
  const tCtx=tmp.getContext('2d');

  });
  ctx.drawImage(tmp,0,0);return c;
}

async function restoreProject(e){
  const file=e.target.files[0];if(!file)return;e.target.value='';
  const reader=new FileReader();
  reader.onload=async ev=>{
    try{
      const backup=JSON.parse(ev.target.result);if(!backup.sheets){toast('⚠️ 無効なファイルです','#e94560');return;}
      const id='p'+Date.now(),name=backup.projectName||'復元データ';
      const ps=loadProjs();ps.unshift({id,name,date:new Date().toLocaleDateString('ja-JP')});saveProjs(ps);

      // 各シートの画像サイズを取得してピクセル座標→比率に正確に変換
      const convertedSheets=await Promise.all(backup.sheets.map(async(s,i)=>{
        const imgData=s.imageData||null;
        let imgW=1,imgH=1;
        if(imgData){
          // 画像の元サイズを取得
          await new Promise(r=>{
            const img=new Image();
            img.onload=()=>{imgW=img.naturalWidth;imgH=img.naturalHeight;r();};
            img.onerror=r;
            img.src=imgData;
          });
        }
        const convertedMarkers=(s.markers||[]).map(m=>{
          if(m.x>1||m.y>1){
            // ピクセル座標→比率に変換（元画像サイズ基準）
            return {...m,x:m.x/imgW,y:m.y/imgH,_needsConvert:false};
          }
          return m;
        });
        return {name:s.name,markers:convertedMarkers};
      }));

let repMode='current';
function showReport(mode){

  } else {
    document.getElementById('repTitle').textContent='📋 全図面合計';
    const allStats={};Object.keys(DEFECTS).forEach(k=>allStats[k]={total:0,memos:[],sheets:[]});
    sheets.forEach((s,i)=>{
      const ms=i===currentSheetIdx?markers:s.markers;
      ms.forEach(m=>{allStats[m.type].total+=(m.value||0);if(m.memo)allStats[m.type].memos.push(m.memo);if(!allStats[m.type].sheets.includes(s.name))allStats[m.type].sheets.push(s.name);});
    });

      const ms=i===currentSheetIdx?markers:s.markers;if(!ms.length)return;any=true;
      tbody.innerHTML+=`<tr><td colspan="3" style="background:#f0f0f0;font-weight:700;font-size:11px;padding:6px 10px;">📄 ${s.name}</td></tr>`;

  }

}
function renderRepRows(tbody,ms){
  const stats={};Object.keys(DEFECTS).forEach(k=>stats[k]={total:0,memos:[]});
  ms.forEach(m=>{stats[m.type].total+=(m.value||0);if(m.memo)stats[m.type].memos.push(m.memo);});
  const used=Object.entries(DEFECTS).filter(([k])=>ms.some(m=>m.type===k));
  if(!used.length){tbody.innerHTML+='<tr><td colspan="3" style="text-align:center;color:#999;padding:10px;font-size:12px">マーキングなし</td></tr>';return;}
  used.forEach(([k,d])=>{
    const s=stats[k];
    const vs=s.total>0?`${s.total%1===0?s.total:s.total.toFixed(2)}${d.unitLabel}`:'—';
    tbody.innerHTML+=`<tr><td><span class="badge" style="background:${d.color}"></span><strong>${d.label}</strong></td><td style="text-align:right;font-weight:700;font-size:14px">${vs}</td><td style="text-align:right;color:#666;font-size:12px">${s.memos.join('、')||'—'}</td></tr>`;

}

function buildRepCanvas(){
  const title=document.getElementById('repTitle').textContent;
  const rows=Array.from(document.getElementById('repBody').querySelectorAll('tr'));
  const W=640,lH=32,hH=54,pad=22,H=hH+rows.length*lH+pad*2;
  const canvas=document.createElement('canvas');canvas.width=W*2;canvas.height=H*2;
  const ctx=canvas.getContext('2d');ctx.scale(2,2);
  ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#1a1a2e';ctx.fillRect(0,0,W,hH);
  ctx.fillStyle='white';ctx.font='bold 15px sans-serif';ctx.textBaseline='middle';ctx.fillText(title,pad,hH/2);
  ctx.font='10px sans-serif';ctx.fillStyle='rgba(255,255,255,.7)';ctx.textAlign='right';ctx.fillText(new Date().toLocaleDateString('ja-JP'),W-pad,hH/2);ctx.textAlign='left';
  const thY=hH+pad*.4;
  ctx.fillStyle='#f0f0f0';ctx.fillRect(0,thY,W,lH);
  ctx.fillStyle='#555';ctx.font='bold 11px sans-serif';ctx.textBaseline='middle';
  ctx.fillText('種別',pad,thY+lH/2);ctx.textAlign='right';ctx.fillText('数量',W/2+80,thY+lH/2);ctx.fillText('メモ',W-pad,thY+lH/2);ctx.textAlign='left';
  rows.forEach((row,i)=>{
    const y=thY+lH*(i+1);ctx.fillStyle=i%2===0?'#fff':'#f8f8f8';ctx.fillRect(0,y,W,lH);
    const cells=row.querySelectorAll('td');if(!cells.length)return;
    if(cells.length===1){const bg=cells[0].style.background||'#e0e0e0';ctx.fillStyle=bg;ctx.fillRect(0,y,W,lH);ctx.fillStyle=bg==='rgb(26, 26, 46)'||bg==='#1a1a2e'?'white':'#333';ctx.font='bold 10px sans-serif';ctx.fillText(cells[0].textContent.trim(),pad,y+lH/2);return;}
    const badge=cells[0].querySelector('.badge');
    if(badge){ctx.fillStyle=badge.style.background||'#888';ctx.beginPath();ctx.arc(pad+4,y+lH/2,4,0,Math.PI*2);ctx.fill();}
    ctx.fillStyle='#1a1a2e';ctx.font='12px sans-serif';ctx.textBaseline='middle';ctx.fillText(cells[0].textContent.trim(),pad+12,y+lH/2);
    if(cells[1]){ctx.font='bold 13px sans-serif';ctx.textAlign='right';ctx.fillText(cells[1].textContent.trim(),W/2+80,y+lH/2);ctx.textAlign='left';}
    if(cells[2]){ctx.fillStyle='#888';ctx.font='10px sans-serif';ctx.textAlign='right';const m=cells[2].textContent.trim();ctx.fillText(m.length>22?m.slice(0,22)+'…':m,W-pad,y+lH/2);ctx.textAlign='left';}
    ctx.strokeStyle='#eee';ctx.lineWidth=.5;ctx.beginPath();ctx.moveTo(0,y+lH);ctx.lineTo(W,y+lH);ctx.stroke();
  });
  return canvas;
}

// ===== ユーティリティ =====
function toast(msg,color='#27ae60'){
  const old=document.getElementById('_toast');if(old)old.remove();
  const t=document.createElement('div');t.id='_toast';
  t.style.cssText=`position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:${color};color:white;padding:8px 18px;border-radius:20px;font-size:12px;font-weight:700;z-index:9000;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,.3);pointer-events:none;`;
  t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2500);
}
function confirmModal(msg,onOk){
  const old=document.getElementById('_confirm');if(old)old.remove();
  const modal=document.createElement('div');modal.id='_confirm';
  modal.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:5000;display:flex;align-items:center;justify-content:center;';
  modal.innerHTML=`<div style="background:#1a1a2e;border-radius:16px;padding:22px;width:min(320px,88vw);color:white;"><p style="font-size:14px;margin-bottom:18px;line-height:1.6;">${msg}</p><div style="display:flex;gap:10px;"><button id="_cfNo" style="flex:1;padding:11px;border:none;border-radius:10px;background:#2a2a4a;color:#ccc;font-size:14px;cursor:pointer;">キャンセル</button><button id="_cfYes" style="flex:1;padding:11px;border:none;border-radius:10px;background:#e94560;color:white;font-size:14px;font-weight:700;cursor:pointer;">削除</button></div></div>`;
  document.body.appendChild(modal);
  document.getElementById('_cfNo').onclick=()=>modal.remove();
  document.getElementById('_cfYes').onclick=()=>{modal.remove();onOk();};
}
function inputModal(title,defaultVal,onOk){
  const old=document.getElementById('_input');if(old)old.remove();
  const modal=document.createElement('div');modal.id='_input';
  modal.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:5000;display:flex;align-items:center;justify-content:center;';
  modal.innerHTML=`<div style="background:#1a1a2e;border-radius:16px;padding:22px;width:min(340px,88vw);color:white;"><p style="font-size:14px;font-weight:700;margin-bottom:12px;">${title}</p><input id="_inputVal" type="text" value="${defaultVal}" style="width:100%;padding:11px 13px;border-radius:10px;border:none;font-size:15px;font-family:inherit;background:#2a2a4a;color:white;margin-bottom:14px;" onkeydown="if(event.key==='Enter')document.getElementById('_inputOk').click()"><div style="display:flex;gap:10px;"><button onclick="document.getElementById('_input').remove()" style="flex:1;padding:11px;border:none;border-radius:10px;background:#2a2a4a;color:#ccc;font-size:14px;cursor:pointer;">キャンセル</button><button id="_inputOk" style="flex:1;padding:11px;border:none;border-radius:10px;background:#f5a623;color:#1a1a1a;font-size:14px;font-weight:700;cursor:pointer;">変更</button></div></div>`;
  document.body.appendChild(modal);
  setTimeout(()=>{const i=document.getElementById('_inputVal');if(i){i.focus();i.select();}},100);
  document.getElementById('_inputOk').onclick=()=>{const v=document.getElementById('_inputVal')?.value?.trim();modal.remove();if(v)onOk(v);};
}

});
