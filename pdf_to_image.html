<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>PDF → 図面変換</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;background:#0f0f1a;min-height:100dvh;color:white;padding:0 0 40px;}
header{background:#1a1a2e;padding:16px 20px;border-bottom:2px solid #f5a623;display:flex;align-items:center;gap:12px;}
header h1{font-size:18px;font-weight:800;}
header h1 span{color:#f5a623;}
header p{font-size:11px;color:#888;margin-top:2px;}
.back-btn{padding:6px 12px;background:#2a2a4a;color:#f5a623;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;text-decoration:none;flex-shrink:0;}
.body{padding:16px;}
.notice{background:#1a2a1a;border:1px solid #27ae60;border-radius:10px;padding:12px 16px;font-size:12px;color:#7dcea0;margin-bottom:16px;line-height:1.7;}
/* ドロップゾーン */
.drop-zone{border:2.5px dashed #444;border-radius:16px;background:#1a1a2e;padding:36px 20px;text-align:center;cursor:pointer;margin-bottom:16px;transition:all .2s;}
.drop-zone.drag-over{border-color:#f5a623;background:#1a1a2e;}
.drop-zone .icon{font-size:48px;margin-bottom:12px;}
.drop-zone p{font-size:15px;color:#ccc;}
.drop-zone small{font-size:12px;color:#888;margin-top:6px;display:block;}
/* 設定 */
.settings{background:#1a1a2e;border-radius:14px;padding:16px;margin-bottom:16px;display:none;}
.settings h3{font-size:11px;font-weight:700;color:#888;letter-spacing:.1em;margin-bottom:12px;}
.setting-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:13px;}
.setting-row label{min-width:70px;color:#aaa;}
.setting-row select{flex:1;padding:8px 10px;border:1px solid #2a2a4a;border-radius:8px;font-size:13px;background:#2a2a4a;color:white;}
.setting-row input[type=range]{flex:1;accent-color:#f5a623;}
.setting-row span{font-size:12px;color:#888;min-width:50px;}
/* ボタン */
.btn{width:100%;padding:15px;border:none;border-radius:14px;font-size:15px;font-weight:700;cursor:pointer;margin-bottom:12px;display:none;transition:all .2s;}
.btn:active{transform:scale(.98);}
.btn-convert{background:#1a1a2e;color:white;border:2px solid #f5a623;}
.btn-send{background:#f5a623;color:#1a1a1a;}
.btn-dl{background:#27ae60;color:white;}
/* プログレス */
.progress-bar{background:#2a2a4a;border-radius:8px;height:8px;display:none;margin-bottom:10px;overflow:hidden;}
.progress-fill{height:100%;background:#f5a623;border-radius:8px;transition:width .3s;width:0%;}
.progress-text{text-align:center;font-size:13px;color:#888;margin-bottom:16px;display:none;}
/* 結果 */
.result-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:8px;}
.result-card{background:#1a1a2e;border-radius:12px;overflow:hidden;border:2px solid transparent;transition:all .2s;cursor:pointer;}
.result-card.selected{border-color:#f5a623;}
.result-card img{width:100%;height:140px;object-fit:contain;background:#fff;display:block;}
.result-card-body{padding:8px 10px;display:flex;align-items:center;justify-content:space-between;}
.result-card-body span{font-size:11px;color:#888;}
.dl-btn{padding:5px 10px;background:#2a2a4a;color:white;border:none;border-radius:6px;font-size:11px;cursor:pointer;}
.check{font-size:18px;display:none;}
.result-card.selected .check{display:inline;}
/* 選択ツールバー */
.select-bar{background:#1a1a2e;border-radius:14px;padding:12px 16px;margin-top:12px;display:none;align-items:center;justify-content:space-between;}
.sel-count{font-size:13px;color:#f5a623;font-weight:700;}
.sel-btns{display:flex;gap:8px;}
.sel-btn{padding:7px 12px;border:none;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;}
</style>
</head>
<body>
<header>
  <a class="back-btn" href="index.html">← アプリへ</a>
  <div>
    <h1>PDF <span>→</span> 図面変換</h1>
    <p>PDFを高画質画像に変換して補修図面アプリで使用</p>
  </div>
</header>

<div class="body">
  <div class="notice">
    🔒 データは端末内のみで処理されます。外部送信なし・完全無料。<br>
    📌 変換後「アプリへ送る」で補修図面アプリに直接読み込めます。
  </div>

  <div class="drop-zone" id="dropZone" onclick="document.getElementById('pdfInput').click()">
    <div class="icon">📄</div>
    <p>PDFをタップして選択</p>
    <small>ファイルアプリ・iCloud Drive・メールから選択可能</small>
  </div>
  <input type="file" id="pdfInput" accept="application/pdf,.pdf" onchange="handleFile(event)" style="display:none">

  <div class="settings" id="settings">
    <h3>変換設定</h3>
    <div class="setting-row">
      <label>画質</label>
      <input type="range" id="dpiRange" min="1" max="4" value="3" step="0.5"
        oninput="updateDpiLabel(this.value)">
      <span id="dpiVal">高画質（3倍）</span>
    </div>
    <div class="setting-row">
      <label>形式</label>
      <select id="formatSelect">
        <option value="image/png" selected>PNG（高品質・推奨）</option>
        <option value="image/jpeg">JPEG（ファイル小）</option>
      </select>
    </div>
  </div>

  <button class="btn btn-convert" id="convertBtn" onclick="convertAll()">🔄 変換開始</button>

  <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="progress-text" id="progressText"></div>

  <div class="result-grid" id="resultGrid"></div>

  <div class="select-bar" id="selectBar">
    <span class="sel-count" id="selCount">0ページ選択中</span>
    <div class="sel-btns">
      <button class="sel-btn" style="background:#2a2a4a;color:white;" onclick="selectAll()">全選択</button>
      <button class="sel-btn" style="background:#27ae60;color:white;" onclick="downloadSelected()">⬇️ 保存</button>
      <button class="sel-btn" style="background:#f5a623;color:#1a1a1a;" onclick="sendToApp()">📤 アプリへ送る</button>
    </div>
  </div>

  <button class="btn btn-dl" id="dlAllBtn" onclick="downloadAll()">⬇️ 全ページ保存</button>
</div>

<script>
let pdfFile=null, convertedImages=[], selectedPages=new Set();

function updateDpiLabel(v){
  const labels={1:'標準（1倍）',1.5:'やや高（1.5倍）',2:'高画質（2倍）',2.5:'超高（2.5倍）',3:'最高（3倍）',3.5:'超高精細（3.5倍）',4:'印刷品質（4倍）'};
  document.getElementById('dpiVal').textContent=labels[v]||v+'倍';
}

const dropZone=document.getElementById('dropZone');
dropZone.addEventListener('dragover',e=>{e.preventDefault();dropZone.classList.add('drag-over');});
dropZone.addEventListener('dragleave',()=>dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop',e=>{
  e.preventDefault();dropZone.classList.remove('drag-over');
  const file=e.dataTransfer.files[0];
  if(file)processFile(file);
});

function handleFile(e){
  const file=e.target.files[0];if(file)processFile(file);e.target.value='';
}

function processFile(file){
  pdfFile=file;
  dropZone.querySelector('p').textContent=`📄 ${file.name}`;
  dropZone.querySelector('small').textContent=`${(file.size/1024/1024).toFixed(1)} MB・タップで変更`;
  document.getElementById('settings').style.display='block';
  document.getElementById('convertBtn').style.display='block';
  document.getElementById('resultGrid').innerHTML='';
  document.getElementById('dlAllBtn').style.display='none';
  document.getElementById('selectBar').style.display='none';
  convertedImages=[];selectedPages=new Set();
}

async function convertAll(){
  if(!pdfFile)return;
  const btn=document.getElementById('convertBtn');
  btn.disabled=true;btn.textContent='変換中...';
  document.getElementById('progressBar').style.display='block';
  document.getElementById('progressText').style.display='block';
  document.getElementById('resultGrid').innerHTML='';
  document.getElementById('dlAllBtn').style.display='none';
  document.getElementById('selectBar').style.display='none';
  convertedImages=[];selectedPages=new Set();

  const scale=parseFloat(document.getElementById('dpiRange').value);
  const format=document.getElementById('formatSelect').value;

  // PDF.jsをCDNからロード
  if(!window.pdfjsLib){
    await new Promise((res,rej)=>{
      const s=document.createElement('script');
      s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
      s.onload=()=>{
        pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        res();
      };
      s.onerror=rej;
      document.head.appendChild(s);
    });
  }

  try{
    const arrayBuf=await pdfFile.arrayBuffer();
    const pdf=await pdfjsLib.getDocument({data:arrayBuf}).promise;
    const total=pdf.numPages;

    for(let i=1;i<=total;i++){
      setProgress(i,total,`ページ ${i} / ${total} を変換中...`);
      const page=await pdf.getPage(i);
      const viewport=page.getViewport({scale});
      const canvas=document.createElement('canvas');
      canvas.width=viewport.width;canvas.height=viewport.height;
      await page.render({canvasContext:canvas.getContext('2d'),viewport}).promise;
      const ext=format==='image/png'?'png':'jpg';
      const fname=pdfFile.name.replace(/\.pdf$/i,'')+`_P${String(i).padStart(2,'0')}.${ext}`;
      const dataUrl=canvas.toDataURL(format,0.95);
      convertedImages.push({dataUrl,name:fname,page:i});
      addCard(dataUrl,i,total,fname);
    }

    setProgress(total,total,`✅ ${total}ページの変換が完了しました！`);
    document.getElementById('dlAllBtn').style.display='block';
    document.getElementById('selectBar').style.display='flex';
    selectAll();
  }catch(e){
    document.getElementById('progressText').textContent='❌ 変換失敗：'+e.message;
  }

  btn.disabled=false;btn.textContent='🔄 変換開始';
}

function setProgress(cur,total,text){
  document.getElementById('progressFill').style.width=Math.round(cur/total*100)+'%';
  document.getElementById('progressText').textContent=text;
}

function addCard(dataUrl,pageNum,total,fname){
  const grid=document.getElementById('resultGrid');
  const card=document.createElement('div');
  card.className='result-card';
  card.dataset.page=pageNum;
  card.innerHTML=`
    <img src="${dataUrl}" alt="ページ ${pageNum}">
    <div class="result-card-body">
      <span>P${pageNum}/${total} <span class="check">✅</span></span>
      <button class="dl-btn" onclick="event.stopPropagation();dlOne(${pageNum-1})">⬇️</button>
    </div>`;
  card.onclick=()=>toggleSelect(pageNum,card);
  grid.appendChild(card);
}

function toggleSelect(page,card){
  if(selectedPages.has(page)){selectedPages.delete(page);card.classList.remove('selected');}
  else{selectedPages.add(page);card.classList.add('selected');}
  updateSelCount();
}

function selectAll(){
  convertedImages.forEach((_,i)=>{
    selectedPages.add(i+1);
    document.querySelectorAll('.result-card')[i]?.classList.add('selected');
  });
  updateSelCount();
}

function updateSelCount(){
  document.getElementById('selCount').textContent=`${selectedPages.size}ページ選択中`;
}

function dlOne(idx){
  const {dataUrl,name}=convertedImages[idx];
  const a=document.createElement('a');a.href=dataUrl;a.download=name;a.click();
}

function downloadSelected(){
  [...selectedPages].sort().forEach(async(page,i)=>{
    await new Promise(r=>setTimeout(r,300*i));
    dlOne(page-1);
  });
}

function downloadAll(){
  convertedImages.forEach((_,i)=>setTimeout(()=>dlOne(i),300*i));
}

// 選択ページをlocalStorageに保存してアプリに渡す
function sendToApp(){
  if(!selectedPages.size){alert('ページを選択してください');return;}
  const selected=[...selectedPages].sort().map(p=>convertedImages[p-1]);
  const pdfBaseName=pdfFile.name.replace(/\.pdf$/i,'');
  try{
    // LocalStorageに一時保存（index.htmlで読み取る）
    const payload=JSON.stringify({
      type:'pdf_import',
      baseName:pdfBaseName,
      pages:selected.map(s=>({name:s.name,dataUrl:s.dataUrl}))
    });
    localStorage.setItem('hoshu_pdf_import',payload);
    // アプリへ遷移
    window.location.href='index.html?from=pdf';
  }catch(e){
    alert('データが大きすぎます。ページを少なく選択するか、JPEGを選んで再変換してください。');
  }
}
</script>
</body>
</html>
